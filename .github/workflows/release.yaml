---
name: Release

on:
  pull_request:
    branches: [main]
    types: [closed]

# Scoped for the reusable workflows: create the release/tag and GHCR push.
permissions:
  contents: write
  packages: write
  pull-requests: write
  security-events: write
  actions: write
  checks: read

jobs:
  create-release:
    if: github.event.pull_request.merged == true
    uses: obervinov/_templates/.github/workflows/release.yaml@v4.2.0

  build-release-image:
    # a Dependabot merge releases nothing; rebuilding then would overwrite the released image
    if: github.event.pull_request.merged == true && needs.create-release.outputs.released == 'true'
    uses: obervinov/_templates/.github/workflows/docker.yaml@v4.2.0
    needs: [create-release]
